# Local services for development. Postgres + Redis, plus an Upstash-compatible
# REST shim so @upstash/redis works against local Redis.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: everydaily
      POSTGRES_PASSWORD: everydaily
      POSTGRES_DB: everydaily
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U everydaily']
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  redis-http:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '8079:80'
    depends_on:
      - redis

volumes:
  pgdata:
