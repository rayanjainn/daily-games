name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: everydaily
          POSTGRES_PASSWORD: everydaily
          POSTGRES_DB: everydaily_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U everydaily" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://everydaily:everydaily@localhost:5432/everydaily_test
      TEST_DATABASE_URL: postgres://everydaily:everydaily@localhost:5432/everydaily_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:history

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: everydaily
          POSTGRES_PASSWORD: everydaily
          POSTGRES_DB: everydaily_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U everydaily" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      E2E_DATABASE_URL: postgres://everydaily:everydaily@localhost:5432/everydaily_e2e
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (functional + accessibility)
        working-directory: apps/web
        run: pnpm exec playwright test --project e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-e2e
          path: apps/web/playwright-report
          retention-days: 7

  # Visual regression runs in Playwright's pinned image so font rendering matches the
  # committed baselines exactly. Baselines are produced by the visual-baselines workflow.
  visual:
    runs-on: ubuntu-latest
    needs: checks
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright (visual regression)
        working-directory: apps/web
        env:
          VISUAL: '1'
        run: pnpm exec playwright test --project visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-visual
          path: apps/web/playwright-report
          retention-days: 7
