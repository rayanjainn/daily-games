name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: everydaily
          POSTGRES_PASSWORD: everydaily
          POSTGRES_DB: everydaily_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U everydaily" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://everydaily:everydaily@localhost:5432/everydaily_test
      TEST_DATABASE_URL: postgres://everydaily:everydaily@localhost:5432/everydaily_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:history
