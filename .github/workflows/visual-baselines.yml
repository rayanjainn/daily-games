name: Visual baselines

# Regenerates Playwright visual-regression baselines in the same pinned image the CI visual job
# uses, and uploads them as an artifact to review and commit. Every baseline is rewritten: small
# colour changes fall inside the comparison tolerance and would otherwise keep the old image.
on:
  workflow_dispatch:

jobs:
  baselines:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: everydaily
          POSTGRES_PASSWORD: everydaily
          POSTGRES_DB: everydaily_e2e
        options: >-
          --health-cmd "pg_isready -U everydaily" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
    env:
      E2E_DATABASE_URL: postgres://everydaily:everydaily@postgres:5432/everydaily_e2e
      REDIS_URL: redis://redis:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update snapshots
        working-directory: apps/web
        env:
          VISUAL: '1'
        run: pnpm exec playwright test --project visual --update-snapshots=all
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/web/e2e/**/*-snapshots/**
          retention-days: 7
