name = "everydaily-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
VAPID_SUBJECT = "mailto:hello@everydaily.raycode.tech"
# Development-only routes (e.g. /dev/push). Never set to "1" in production.
DEV_ROUTES = "0"
APP_URL = "https://everydaily.raycode.tech"

# Optional email reminders: the sender address on a domain verified in Resend.
# EMAIL_FROM = "EveryDaily <reminders@everydaily.raycode.tech>"

# Secrets (wrangler secret put …):
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, REALTIME_PUBLIC_KEY, INTERNAL_BROADCAST_SECRET
#   RESEND_API_KEY (optional, for email reminders)

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Postgres through Hyperdrive. Create it with
#   wrangler hyperdrive create everydaily-db --connection-string="<Neon direct URL>"
# and put the returned id here. localConnectionString is used by `wrangler dev` only.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
localConnectionString = "postgres://everydaily:everydaily@localhost:5432/everydaily"

# Realtime and internal routes on your own domain (the zone must be in this Cloudflare account).
# Without it the worker is still reachable at https://everydaily-worker.<account>.workers.dev.
# [[routes]]
# pattern = "rt.everydaily.raycode.tech"
# custom_domain = true

[triggers]
# Daily game URL health check (src/health.ts) and reminders every 15 minutes (src/reminders.ts).
crons = ["17 4 * * *", "*/15 * * * *"]

# Reminder fan-out: the cron enqueues one message per reminder, the consumer sends the pushes.
# Create once with: wrangler queues create everydaily-reminders
[[queues.producers]]
binding = "REMINDERS"
queue = "everydaily-reminders"

[[queues.consumers]]
queue = "everydaily-reminders"
max_batch_size = 50
max_batch_timeout = 5
max_retries = 3
